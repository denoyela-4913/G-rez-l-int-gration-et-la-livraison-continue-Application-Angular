# Valeurs par défaut du chart. Même schéma que values.tpl.yaml (app.image, app.port, app.imagePullSecret),
# complété par app.replicas et service.*.
# Chaque environnement les surcharge dans son fichier : values-dev.yaml, values-staging.yaml.
app:
  # Image complète, tag compris (ex. ghcr.io/utilisateur/image:0.2.0). Pas de valeur par défaut : chaque
  # environnement doit choisir sa version, le chart refuse de s'installer sans (voir le template).
  image: ""
  # Port d'écoute du conteneur (Nginx tourne sans root, donc un port supérieur à 1024).
  port: 8080
  # Nom d'un Secret de type docker-registry pour tirer l'image d'un registre PRIVÉ. Vide : pas de secret
  # (cas du paquet GHCR public). Le Secret doit exister dans le namespace avant l'installation.
  imagePullSecret: ""
  replicas: 1
  # Pause (en secondes) avant l'arrêt d'un pod, pour laisser le Service le retirer de sa liste : évite la coupure
  # lors d'une mise à jour. 0 : pas de pause. Doit rester inférieure au délai de grâce de Kubernetes (30 s).
  preStopSeconds: 5
  # Sondes de santé de l'application. enabled: false les supprime toutes (utile pour comparer ou déboguer).
  # Pas de sonde de démarrage : Nginx démarre en moins d'une seconde.
  probes:
    enabled: true
    # Route interrogée (HTTP, sur le port du conteneur).
    path: /
    # Prêt : en cas d'échec, le pod est retiré du Service, sans être redémarré.
    readiness:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    # Vivant : en cas d'échec, le conteneur est redémarré (3 x 10 s = 30 s de tolérance).
    liveness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

service:
  type: LoadBalancer
  # Port du Service sur la machine (avec minikube tunnel). Le 80 est privilégié : le tunnel demande sudo.
  port: 80
