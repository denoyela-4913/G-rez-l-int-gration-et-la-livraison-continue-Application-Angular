# Environnement de pré-production.
# Installation : helm install olympic charts/olympic-games -f charts/olympic-games/values-staging.yaml -n olympic-staging --create-namespace
app:
  # Tag écrit à la main, indépendant de celui de dev : staging ne change de version que sur décision.
  image: ghcr.io/denoyela-4913/oc-p04-angular-olympic-games-tracker:0.2.0
  replicas: 2

service:
  # 8081 et non 80 : dev et staging peuvent ainsi être installés ET joignables en même temps. Avec
  # minikube tunnel, deux Services sur le même port se partagent le même port de la machine : l'un masque l'autre.
  port: 8081
