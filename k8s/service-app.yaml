apiVersion: v1
kind: Service
metadata:
  name: olympic-games-app-service
spec:
  selector:
    app: olympic-games-app
  ports:
    - protocol: TCP
      # Port 80 : l'application est visible sur le port 80 de la machine. C'est un port privilégié
      # (< 1024) : "minikube tunnel" ne le publie que si l'on saisit le mot de passe sudo quand il le demande.
      # Le conteneur écoute sur 8080 (Nginx tourne sans root), d'où le targetPort.
      port: 80
      targetPort: 8080
  type: LoadBalancer
