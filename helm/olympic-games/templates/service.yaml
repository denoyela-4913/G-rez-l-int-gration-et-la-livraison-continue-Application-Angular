apiVersion: v1
kind: Service
metadata:
  name: olympic-games-app-service
  labels:
    {{- include "olympic-games.labels" . | nindent 4 }}
spec:
  selector:
    app: olympic-games-app
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.app.port }}
  type: {{ .Values.service.type }}
